<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radio</title>
<style>
  :root {
    --black:  #0e0e0e;
    --dark:   #1c1c1c;
    --body-a: #323232;
    --body-b: #242424;
    --grey:   #6f6f6f;
    --light:  #bdbdbd;
    --paper:  #e7e3d8;   /* off-white */
    --ink:    #151515;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--black);
    color: var(--paper);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 7vh 16px 10vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ================= GEHÄUSE ================= */
  .radio {
    width: min(780px, 100%);
    background: linear-gradient(180deg, var(--body-a), var(--body-b));
    border-radius: 28px;
    padding: 26px;
    display: grid;
    grid-template-columns: 1fr 1.35fr;
    gap: 26px;
    box-shadow:
      0 30px 60px rgba(0,0,0,.6),
      inset 0 1px 0 rgba(255,255,255,.08),
      inset 0 -2px 0 rgba(0,0,0,.4);
  }

  /* Lautsprecher-Gitter */
  .grille {
    border-radius: 16px;
    min-height: 270px;
    background-color: #202020;
    background-image: radial-gradient(circle, #070707 2.3px, transparent 2.8px);
    background-size: 13px 13px;
    background-position: 6px 6px;
    box-shadow: inset 0 3px 8px rgba(0,0,0,.7), 0 1px 0 rgba(255,255,255,.06);
  }

  .panel {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 22px;
  }

  /* ================= SKALA ================= */
  .dial {
    position: relative;
    height: 128px;
    background: linear-gradient(180deg, #ece8dc, #dcd8cb);
    border-radius: 8px;
    box-shadow: inset 0 2px 6px rgba(0,0,0,.45), 0 1px 0 rgba(255,255,255,.08);
    overflow: hidden;
    color: var(--ink);
  }
  .dial .tag {
    position: absolute;
    bottom: 9px;
    font-size: 9px;
    letter-spacing: .2em;
    color: #55524a;
  }
  .dial .tag.l { left: 14px; }
  .dial .tag.r { right: 14px; }

  .scale {                       /* gemeinsames Koordinatensystem */
    position: absolute;
    left: 6%; right: 6%;
    top: 0; bottom: 0;
  }
  .tick {
    position: absolute;
    top: 40px;
    width: 1px;
    background: var(--ink);
  }
  .tick.half  { height: 10px; opacity: .55; }
  .tick.whole { height: 18px; opacity: .8; }
  .tick.major { height: 28px; opacity: 1; width: 1.5px; }
  .num {
    position: absolute;
    top: 12px;
    transform: translateX(-50%);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .05em;
  }
  .station {                     /* Sendermarken */
    position: absolute;
    bottom: 26px;
    transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center;
    font-size: 9px;
    color: #55524a;
    gap: 2px;
  }
  .station i {
    display: block; width: 6px; height: 6px;
    border: 1px solid var(--ink);
    border-radius: 50%;
    transition: background .2s;
  }
  .station.active { color: var(--ink); font-weight: 700; }
  .station.active i { background: var(--ink); }

  .needle {
    position: absolute;
    top: 0; bottom: 0;
    width: 2px;
    margin-left: -1px;
    background: var(--ink);
    box-shadow: 1px 0 3px rgba(0,0,0,.25);
  }
  .needle::before {
    content: "";
    position: absolute; top: 0; left: -3px;
    border-left: 4px solid transparent;
    border-right: 4px solid transparent;
    border-top: 7px solid var(--ink);
  }

  /* ================= STEUERUNG ================= */
  .controls {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
  }
  .readout { padding-bottom: 6px; }
  .readout .brand {
    font-size: 10px;
    letter-spacing: .32em;
    color: var(--grey);
    margin-bottom: 14px;
    display: flex; align-items: center; gap: 9px;
  }
  .lamp {
    width: 7px; height: 7px; border-radius: 50%;
    background: #3a3a3a;
    transition: background .3s, box-shadow .3s;
  }
  .lamp.on { background: var(--paper); box-shadow: 0 0 8px 1px rgba(231,227,216,.7); }
  .freq {
    font-size: 40px;
    font-weight: 300;
    letter-spacing: -.02em;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .freq small {
    font-size: 11px;
    letter-spacing: .2em;
    color: var(--grey);
    margin-left: 6px;
  }

  .knob {
    flex: none;
    width: 128px; height: 128px;
    border-radius: 50%;
    position: relative;
    cursor: grab;
    touch-action: none;
    user-select: none;
    outline: none;
    background: repeating-conic-gradient(from 0deg, #4a4a4a 0 2.5deg, #2a2a2a 2.5deg 5deg);
    box-shadow: 0 10px 20px rgba(0,0,0,.6), 0 0 0 2px #151515;
  }
  .knob:active { cursor: grabbing; }
  .knob:focus-visible { box-shadow: 0 10px 20px rgba(0,0,0,.6), 0 0 0 2px #151515, 0 0 0 4px var(--paper); }
  .knob::after {                 /* Kappe */
    content: "";
    position: absolute; inset: 11px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 28%, #555, #262626 72%);
    box-shadow: inset 0 1px 1px rgba(255,255,255,.18), 0 2px 5px rgba(0,0,0,.6);
  }
  .knob::before {                /* Markierung */
    content: "";
    position: absolute; z-index: 1;
    top: 17px; left: 50%;
    width: 3px; height: 22px;
    margin-left: -1.5px;
    border-radius: 2px;
    background: var(--paper);
  }

  /* ================= TEXTTAFEL ================= */
  .plate {
    position: relative;
    width: min(780px, 100%);
    margin-top: 26px;
    background: var(--paper);
    color: var(--ink);
    padding: 30px 40px 34px;
    border-radius: 4px;
    box-shadow: 0 14px 30px rgba(0,0,0,.45);
  }
  .plate::before, .plate::after {   /* Schrauben */
    content: "";
    position: absolute; top: 14px;
    width: 7px; height: 7px; border-radius: 50%;
    background: #bab5a6;
    box-shadow: inset 0 1px 1px rgba(0,0,0,.35);
  }
  .plate::before { left: 14px; }
  .plate::after  { right: 14px; }

  .plate .content { transition: opacity .3s; }
  .plate.tuning .content { opacity: .08; }

  .plate .meta {
    font-size: 10px;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: #6a665b;
    margin-bottom: 18px;
  }
  .plate h2 {
    margin: 0 0 14px;
    font-size: 34px;
    font-weight: 600;
    letter-spacing: -.02em;
    line-height: 1.1;
  }
  .plate p {
    margin: 0;
    font-size: 15px;
    line-height: 1.75;
    color: #34322d;
    white-space: pre-line;
    max-width: 60ch;
  }

  .status {
    width: min(780px, 100%);
    margin-top: 14px;
    font-size: 12px;
    color: var(--grey);
    min-height: 1em;
  }

  /* ================= START ================= */
  #start {
    position: fixed; inset: 0; z-index: 10;
    background: var(--black);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
  }
  #start button {
    background: none;
    color: var(--paper);
    border: 1px solid var(--paper);
    border-radius: 2px;
    padding: 16px 36px;
    font: inherit;
    font-size: 12px;
    letter-spacing: .3em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background .2s, color .2s;
  }
  #start button:hover { background: var(--paper); color: var(--black); }
  #start button:disabled { opacity: .5; cursor: default; }
  #start p { margin: 0; font-size: 11px; letter-spacing: .15em; color: var(--grey); }

  @media (max-width: 640px) {
    .radio { grid-template-columns: 1fr; padding: 18px; }
    .grille { min-height: 110px; }
    .plate { padding: 28px 24px 30px; }
    .plate h2 { font-size: 28px; }
  }
</style>
</head>
<body>

<div id="start">
  <button id="startBtn">Radio einschalten</button>
  <p>Ton an</p>
</div>

<main class="radio">
  <div class="grille"></div>

  <div class="panel">
    <div class="dial">
      <div class="scale" id="scale">
        <div class="needle" id="needle"></div>
      </div>
      <span class="tag l">FM</span>
      <span class="tag r">MHz</span>
    </div>

    <div class="controls">
      <div class="readout">
        <div class="brand"><span class="lamp" id="lamp"></span>KÜCHENRADIO</div>
        <div class="freq"><span id="freq">89,0</span><small>MHz</small></div>
      </div>
      <div class="knob" id="knob" tabindex="0" role="slider"
           aria-label="Sendersuchlauf" aria-valuemin="1" aria-valuemax="6" aria-valuenow="1"></div>
    </div>
  </div>
</main>

<!--
  ============================================================
  TEXTTAFEL
  Die Texte (Überschrift + Inhalt) für jedes Programm stehen
  in der Datei script.js ganz oben im Block "PROGRAMM-TEXTE".
  Hier im HTML muss nichts geändert werden.
  ============================================================
-->
<section class="plate" id="plate">
  <div class="content">
    <div class="meta" id="plateMeta"></div>
    <h2 id="plateTitel"></h2>
    <p id="plateInhalt"></p>
  </div>
</section>

<div class="status" id="status"></div>

<script src="script.js"></script>
</body>
</html>
