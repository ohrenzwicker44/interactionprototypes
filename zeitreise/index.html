<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Was kostete das damals?</title>
<style>
  /* ===================================================================
     EINSTELLUNGEN
     =================================================================== */
  :root {
    --bg: #f5f4f0;
    --ink: #141414;
    --muted: #8a8a85;
    --line: #dcdad3;
    --accent: #e5322d;

    /* Größe der Produkte (Regal und Hand) */
    --item-size: clamp(72px, 10vw, 100px);

    /* Wo das Produkt in der rechten Hand sitzt (größer = weiter oben) */
    --held-bottom: 48%;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }

  body {
    min-height: 100vh;
    padding: 28px 16px 32px;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  main { width: 100%; max-width: 1000px; margin: 0 auto; }

  .title {
    margin: 0 0 28px;
    text-align: center;
    font-size: 12px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* ---------------- Tuner ---------------- */
  .tuner {
    width: min(720px, 100%);
    margin: 0 auto;
    outline: none;
    cursor: grab;
    touch-action: pan-y;
    user-select: none;
    -webkit-user-select: none;
  }
  .tuner:focus-visible { outline: 2px solid var(--accent); outline-offset: 10px; border-radius: 4px; }
  body.dragging .tuner { cursor: grabbing; }

  .readout { text-align: center; }
  .year {
    display: block;
    font-size: clamp(56px, 11vw, 96px);
    font-weight: 200;
    line-height: 1;
    letter-spacing: -.02em;
    font-variant-numeric: tabular-nums;
  }
  .era {
    display: block;
    margin-top: 8px;
    font-size: 12px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .dial { position: relative; margin-top: 22px; }

  #scale {
    display: block;
    width: 100%;
    height: 76px;
    -webkit-mask-image: linear-gradient(to right, transparent, #000 14%, #000 86%, transparent);
            mask-image: linear-gradient(to right, transparent, #000 14%, #000 86%, transparent);
  }

  /* Zeiger */
  .needle {
    position: absolute; left: 50%; top: 0; bottom: 0;
    width: 2px; margin-left: -1px;
    background: var(--accent);
    pointer-events: none;
  }
  .needle::before {
    content: ""; position: absolute; top: -4px; left: 50%;
    width: 8px; height: 8px; margin-left: -4px;
    border-radius: 50%; background: var(--accent);
  }

  /* Rändelrad, frontal gesehen: eine Rille pro Jahr */
  .wheel {
    height: 26px;
    margin-top: 8px;
    border-radius: 13px;
    background:
      linear-gradient(to right,
        rgba(20, 20, 20, .30) 0%, rgba(20, 20, 20, 0) 24%,
        rgba(255, 255, 255, .35) 50%,
        rgba(20, 20, 20, 0) 76%, rgba(20, 20, 20, .30) 100%),
      linear-gradient(to right, #c4c1b8 0 2px, #e8e6df 2px) 0 0 / 14px 100% repeat-x;
  }

  .hint { margin: 16px 0 0; text-align: center; font-size: 12px; color: var(--muted); }

  /* ---------------- Bühne: Hand – Regal – Hand ---------------- */
  .stage {
    display: grid;
    grid-template-columns: minmax(80px, 1fr) minmax(0, 3fr) minmax(80px, 1fr);
    grid-template-areas: "left shop right";
    gap: 16px;
    align-items: end;
    margin-top: 56px;
  }
  .hand-left  { grid-area: left; }
  .shop       { grid-area: shop; }
  .hand-right { grid-area: right; }

  .hand {
    position: relative;
    min-height: 200px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: flex-end;
  }
  .hand-art img { display: block; width: 100%; max-width: 220px; height: auto; }
  .hand-art .emoji { font-size: 110px; line-height: 1; opacity: .25; filter: grayscale(1); }
  .hand-left .hand-art .emoji { transform: scaleX(-1); }

  .held {
    position: absolute;
    left: 50%; bottom: var(--held-bottom);
    transform: translateX(-50%);
    width: var(--item-size); height: var(--item-size);
    padding: 0; border: 0; background: none; cursor: pointer;
    z-index: 2;
    transition: transform .15s;
  }
  .held:hover { transform: translateX(-50%) translateY(-3px); }
  .held:empty { pointer-events: none; }
  .held-caption { margin: 8px 0 0; min-height: 2.4em; font-size: 12px; text-align: center; color: var(--muted); }

  .shop-name {
    margin: 0 0 12px;
    text-align: center;
    font-size: 12px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .shelf {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(104px, 1fr));
    gap: 8px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
  }

  .product {
    appearance: none; background: none; border: 0;
    color: inherit; font: inherit; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: 8px 4px;
  }
  .product:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .product:hover .stage { transform: translateY(-3px); }
  .product.taken { cursor: default; }
  .product.taken .stage { visibility: hidden; }
  .product.taken .product-label { opacity: .35; }

  .product-label { font-size: 13px; line-height: 1.3; text-align: center; }
  .product-label small { display: block; font-size: 11px; color: var(--muted); }

  /* Bild + Preis-Sticker */
  .stage {
    position: relative;
    width: var(--item-size); height: var(--item-size);
    display: grid; place-items: center;
    transition: transform .15s;
  }
  .stage img { max-width: 100%; max-height: 100%; object-fit: contain; pointer-events: none; }
  .stage .emoji { font-size: calc(var(--item-size) * .66); line-height: 1; }

  .sticker {
    position: absolute; right: -8px; bottom: 0;
    padding: 4px 7px;
    background: var(--accent); color: #fff;
    font-size: 12px; font-weight: 600; line-height: 1;
    font-variant-numeric: tabular-nums;
    border-radius: 3px;
    transform: rotate(-6deg);
    white-space: nowrap;
    pointer-events: none;
  }
  .sticker.pop { animation: pop .16s ease-out; }
  @keyframes pop {
    from { transform: rotate(-6deg) scale(1.2); }
    to   { transform: rotate(-6deg) scale(1); }
  }

  footer { margin-top: 40px; text-align: center; font-size: 11px; color: var(--muted); opacity: .8; }

  @media (max-width: 760px) {
    .stage {
      grid-template-columns: 1fr 1fr;
      grid-template-areas: "shop shop" "left right";
      margin-top: 40px;
    }
    .hand-art .emoji { font-size: 84px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>

<main>
  <p class="title">Was kostete das damals?</p>

  <!-- Tuner: Skala läuft unter dem festen Zeiger durch -->
  <section class="tuner" id="tuner" role="slider" tabindex="0"
           aria-label="Jahr einstellen" aria-valuemin="1900" aria-valuemax="2025" aria-valuenow="1960">
    <div class="readout">
      <span class="year" id="year">1960</span>
      <span class="era" id="era"></span>
    </div>
    <div class="dial">
      <canvas id="scale"></canvas>
      <div class="wheel" id="wheel"></div>
      <div class="needle"></div>
    </div>
  </section>
  <p class="hint">Ziehen · Mausrad · Pfeiltasten</p>

  <!-- Hand links – Regal – Hand rechts -->
  <section class="stage">
    <aside class="hand hand-left" aria-label="Linke Hand">
      <div class="hand-art" id="handLeftArt"></div>
    </aside>

    <section class="shop" aria-label="Laden">
      <p class="shop-name" id="shopName"></p>
      <div class="shelf" id="shelf"></div>
    </section>

    <aside class="hand hand-right" aria-label="Rechte Hand">
      <div class="hand-art" id="handRightArt"></div>
      <button class="held" id="held" type="button"></button>
      <p class="held-caption" id="heldCaption" aria-live="polite"></p>
    </aside>
  </section>
</main>

<footer>Preise sind Platzhalter – bitte in script.js durch recherchierte Daten ersetzen.</footer>

<script src="script.js"></script>
</body>
</html>
